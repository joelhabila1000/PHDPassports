services:
  - type: web
    name: acu-phd-passport-portal
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: acu-phd-register
          property: connectionString

databases:
  - name: acu-phd-register
    plan: free
    databaseName: acu_phd
    user: acu
